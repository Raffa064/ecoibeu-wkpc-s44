<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#16202f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e2ef"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62d9ff"/>
      <stop offset="1" stop-color="#1aa3e8"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#41577a" stroke-width="6"/>

  <!-- corpo do mouse -->
  <rect x="158" y="82" width="196" height="348" rx="98" fill="url(#body)"/>
  <rect x="158" y="82" width="196" height="348" rx="98" fill="none" stroke="#9fb0c6" stroke-width="5"/>

  <!-- divisão dos botões principais -->
  <path d="M256 87 V216" stroke="#9fb0c6" stroke-width="7" stroke-linecap="round"/>

  <!-- rodinha -->
  <rect x="241" y="124" width="30" height="72" rx="15" fill="#4b6382"/>
  <rect x="248" y="134" width="7" height="30" rx="3.5" fill="#a9c2e0"/>

  <!-- botões laterais remapeados -->
  <rect x="326" y="208" width="44" height="66" rx="22" fill="url(#accent)"/>
  <rect x="326" y="286" width="44" height="66" rx="22" fill="url(#accent2)"/>

  <!-- LED -->
  <circle cx="256" cy="372" r="12" fill="#62d9ff"/>
</svg>
